# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5432, core_db)
# - JWT: iam-api 와 동일한 secret (local 평문 placeholder)
# - 8081 포트로 바인드 (iam-api 가 8080 점유)
# ===================================================================

server:
  port: 8081

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5433/core_db
    username: core
    password: core_local_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      properties:
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG

iam:
  jwt:
    secret: "local-dev-secret-local-dev-secret-local-dev-secret-local-dev-secret-local-dev"
    issuer: "https://iam.local"
    audience: "local-clients"

core:
  attachment:
    storage-path: "./var/attachments"
    public-base-url: "http://localhost:8081/api/v1/error-attachments"
  iam-api:
    base-url: "http://localhost:8080"
  noti-api:
    base-url: "http://localhost:8082"

# 알림 publisher 모드 — `kafka`(default) 또는 `http`(레거시 직접 호출)
noti:
  publisher:
    mode: "${NOTI_PUBLISHER_MODE:kafka}"

# 내부 서비스 인증.
#  - verifier: 게이트웨이가 보낸 토큰(iss=gateway, aud=core-api) 검증.
#  - issuer  : iam-api 호출 시 core-api 가 자기 키로 새 토큰(iss=core-api, aud=iam-api) 발급.
