apiVersion: apps/v1
kind: Deployment
metadata:
  name: noti-api
  labels: { app: noti-api }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # 기존 파드 유지하며 새 파드 Ready 후 교체 → 배포 무중단
    # 주의: SSE 브로커가 in-memory(레플리카-로컬)라 replicas 는 1 유지. fan-out 도입 후 상향(설계문서 §3-1)
  selector:
    matchLabels: { app: noti-api }
  template:
    metadata:
      labels: { app: noti-api }
    spec:
      nodeSelector: { role: apps }
      terminationGracePeriodSeconds: 30            # preStop(5s) + in-flight 정리 여유
      # ghcr public 이미지라 imagePullSecrets 불필요. private 전환 시 여기에 추가.
      containers:
        - name: noti-api
          image: noti-api                       # overlay 의 images: 가 ghcr 경로+태그로 치환
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef: { name: noti-api-env, key: SPRING_PROFILES_ACTIVE }
          envFrom:
            - secretRef:    { name: noti-api-secrets }   # git 밖(kubectl 로 생성). ArgoCD 관리 X
            - configMapRef: { name: noti-api-env }
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 5"] } }   # 종료 전 endpoints 반영 대기(무중단 blip 제거)
          readinessProbe:
            httpGet: { path: /internal/actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          startupProbe:                          # ARM 콜드스타트+다중 JVM 경합 대비: 기동 완료 전 liveness 가 죽이는 것 방지
            httpGet: { path: /internal/actuator/health/liveness, port: 8082 }
            periodSeconds: 5
            failureThreshold: 60                  # 최대 ~300s (정상 콜드스타트 25~150s 커버, 여유 2x)
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /internal/actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits:   { memory: "640Mi" }
