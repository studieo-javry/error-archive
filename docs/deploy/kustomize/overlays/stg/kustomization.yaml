apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# stg 환경(=alpha 브랜치). 네임스페이스 apps.
# 주의: 현재 배포는 prod 스프링 프로파일 + .env.prod 로 동작 → 여기 SPRING_PROFILES_ACTIVE=prod 유지.
namespace: apps

resources:
- ../../base/iam-api
- ../../base/core-api
- ../../base/noti-api
- ../../base/insight-api
- ../../base/publish-api
- ../../base/redis

  # 로그인 없이 둘러보기(게스트 데모) 활성 — iam 이 게스트 토큰 발급 + 데모 봇/WS 부트스트랩 + 야간 게스트 정리.
  # 분산 캐시(workspace-role·iam-user-profile + 대시보드) 공유. 같은 apps ns 의 redis Service.
  # 게스트 데모 콘텐츠 wipe+reseed(야간) 활성. 데모 WS/봇 ID 는 iam /internal/demo/identity 로 조회.
  # SSE 노드 간 pub/sub fan-out 용. 같은 apps ns 의 redis Service.
  # 데모(둘러보기) 발행물 시드 on — 워크스페이스 10건 부팅 시드 + 게스트 /me 지연 시드 + 야간 purge.
  # core-api/iam-api 와 동일. 실서비스 overlay 에선 넣지 않는다(기본 false).
  # LLM 에러 자동구조화(draft-suggestion) 활성. LLM_API_KEY 는 core-api-secrets(kubectl, git 밖)로 주입.
  # 비용 가드: 사용자 분당 5·일 50 쿼터 + 전역 일일 300회(초과 시 그날 LLM off·정규식 폴백) + CircuitBreaker("llm").
  # 전역 상한은 콘솔 spend limit 과 이중 백스톱. (llm.rate-limit.global-per-day ← relaxed binding)
  # 비용 메트릭(llm_draft_estimated_cost_usd_total) 추정 단가(USD/1M tokens). Haiku $1/$5 기준 추정치 —
  # 과금이 아니라 알림용 추정이라 ±오차 허용. 실단가는 콘솔 Usage(비용÷토큰)로 역산해 조정 가능.
configMapGenerator:
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - DEMO_ENABLED=true
  name: iam-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - DEMO_ENABLED=true
  - CORE_GITHUB_ENABLED=true
  - LLM_ENABLED=true
  - LLM_RATE_LIMIT_GLOBAL_PER_DAY=300
  - LLM_PRICE_INPUT_PER_MTOK=1
  - LLM_PRICE_OUTPUT_PER_MTOK=5
  name: core-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  name: noti-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: insight-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - DEMO_ENABLED=true
  name: publish-api-env
generatorOptions:
  disableNameSuffixHash: true

# GitHub Actions(bump-manifest)가 newTag 를 커밋 SHA 로 갱신. 초기값 stg.
images:
- name: core-api
  newName: ghcr.io/studieo-javry/core-api
  newTag: c7c12292480e43746af1a8aabf119cfa07fc4454
- name: iam-api
  newName: ghcr.io/studieo-javry/iam-api
  newTag: 02f4afd7151123ef0032aad85662232ffa352c9e
- name: insight-api
  newName: ghcr.io/studieo-javry/insight-api
  newTag: 02f4afd7151123ef0032aad85662232ffa352c9e
- name: noti-api
  newName: ghcr.io/studieo-javry/noti-api
  newTag: 02f4afd7151123ef0032aad85662232ffa352c9e
- name: publish-api
  newName: ghcr.io/studieo-javry/publish-api
  newTag: 02f4afd7151123ef0032aad85662232ffa352c9e
