apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      nodeSelector: { role: platform }
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: gateway                        # overlay 의 images: 가 ghcr 경로+태그로 치환
          ports:
            - containerPort: 8443
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef: { name: gateway-env, key: SPRING_PROFILES_ACTIVE }
          envFrom:
            - secretRef:    { name: gateway-secrets }   # git 밖(kubectl 로 생성). ArgoCD 관리 X
            - configMapRef: { name: gateway-env }
          volumeMounts:
            - name: tls-keystore
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet: { path: /internal/actuator/health/readiness, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /internal/actuator/health/liveness, port: 8443, scheme: HTTPS }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { memory: "512Mi" }
      volumes:
        - name: tls-keystore
          secret:
            secretName: gateway-tls                     # git 밖(kubectl 로 생성). ArgoCD 관리 X
