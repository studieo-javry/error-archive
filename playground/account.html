<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Account · Error Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens (mirror error-archive-fe/app.css + tailwind zinc/indigo/emerald) ---- */
  :root {
    --bg: #fafafa;            /* zinc-50 */
    --bg-elev: #ffffff;        /* white */
    --text: #18181b;           /* zinc-900 */
    --muted: #71717a;          /* zinc-500 */
    --sub: #a1a1aa;            /* zinc-400 */
    --line: #e4e4e7;           /* zinc-200 */
    --line-2: #f4f4f5;         /* zinc-100 */
    --indigo: #4f46e5;
    --indigo-soft: #eef2ff;
    --indigo-text: #4338ca;
    --emerald: #10b981;
    --emerald-soft: #d1fae5;
    --rose: #f43f5e;
    --rose-soft: #ffe4e6;
    --amber: #f59e0b;
    --amber-soft: #fef3c7;
    --radius: 12px;
  }
  .dark {
    --bg: #18181b;             /* zinc-900 like FE */
    --bg-elev: #27272a;        /* zinc-800 */
    --text: #e4e4e7;
    --muted: #a1a1aa;
    --sub: #71717a;
    --line: #3f3f46;
    --line-2: #27272a;
    --indigo: #818cf8;
    --indigo-soft: #1e1b4b;
    --indigo-text: #c7d2fe;
    --emerald: #34d399;
    --emerald-soft: #064e3b;
    --rose-soft: #4c0519;
    --amber-soft: #451a03;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.5 "Inter", -apple-system, "Segoe UI", "Pretendard", sans-serif;
               transition: background-color .3s, color .3s; }
  .serif { font-family: "Merriweather", serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ---- App shell ---- */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* sidebar — same as FE: 80px width, brand + icon nav + dark toggle */
  .sidebar { width: 80px; background: var(--bg-elev); border-right: 1px solid var(--line);
             display: flex; flex-direction: column; align-items: center; padding: 32px 0; flex-shrink: 0; }
  .brand { font: 700 24px/1 "Merriweather", serif; color: var(--emerald); margin-bottom: 40px; }
  .nav { display: flex; flex-direction: column; gap: 16px; flex: 1; align-items: center; width: 100%; }
  .navItem { width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center;
             justify-content: center; color: var(--sub); transition: all .15s; cursor: pointer; }
  .navItem:hover { background: var(--line-2); color: var(--text); }
  .navItem.active { color: var(--indigo); background: var(--indigo-soft); }
  .dark .navItem:hover { background: var(--line); }
  .themeBtn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: transparent;
              color: var(--sub); display: flex; align-items: center; justify-content: center; }
  .themeBtn:hover { background: var(--line-2); color: var(--text); }

  /* main column */
  .col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* glass header */
  header.glass { position: sticky; top: 0; z-index: 10; padding: 12px 24px; display: flex;
                 align-items: center; justify-content: space-between;
                 background: rgba(255,255,255,.8); backdrop-filter: blur(12px);
                 border-bottom: 1px solid rgba(0,0,0,.05); }
  .dark header.glass { background: rgba(39,39,42,.4); border-bottom: 1px solid rgba(255,255,255,.05); }
  .search { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 420px; color: var(--sub); }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text);
                  font: inherit; }
  .search input::placeholder { color: var(--sub); }
  .bell { position: relative; width: 36px; height: 36px; border-radius: var(--radius); background: transparent;
          border: none; color: var(--muted); display: grid; place-items: center; }
  .bell:hover { background: var(--line-2); color: var(--text); }
  .bell .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px;
               background: var(--rose); color: white; font-size: 10px; font-weight: 600; border-radius: 999px;
               display: grid; place-items: center; }

  /* scrollable main */
  main { flex: 1; overflow-y: auto; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 32px 96px; }

  /* page tabs (within main, for settings) */
  .pageHead { margin-bottom: 24px; }
  .pageHead h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .pageHead .sub { color: var(--muted); font-size: 13px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  .tab { padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--muted); border: none;
         background: transparent; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--indigo); border-bottom-color: var(--indigo); }

  /* card */
  .card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 24px; margin-bottom: 20px; transition: border-color .2s, box-shadow .2s, transform .2s; }
  .card.hoverable:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.05); }
  .dark .card.hoverable:hover { box-shadow: none; }
  .cardHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cardHead h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .cardHead .right { font-size: 12px; color: var(--muted); }

  /* profile hero */
  .hero { display: flex; align-items: flex-start; gap: 24px; }
  .avatar { width: 80px; height: 80px; border-radius: 999px; flex-shrink: 0;
            background: linear-gradient(135deg, #c7d2fe, #a7f3d0); display: grid; place-items: center;
            font: 600 28px/1 "Merriweather", serif; color: white; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hero .info { flex: 1; min-width: 0; }
  .hero h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .hero .email { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .hero .bio { color: var(--muted); font-size: 13px; margin: 10px 0 14px; line-height: 1.55; }

  /* badge */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
           font-size: 11px; font-weight: 500; letter-spacing: .2px; }
  .badge.ok { background: var(--emerald-soft); color: #047857; }
  .dark .badge.ok { color: #6ee7b7; }
  .badge.warn { background: var(--amber-soft); color: #92400e; }
  .dark .badge.warn { color: #fbbf24; }
  .badge.danger { background: var(--rose-soft); color: #9f1239; }
  .dark .badge.danger { color: #fb7185; }
  .badge.mute { background: var(--line-2); color: var(--muted); }
  .dark .badge.mute { background: var(--line); }

  /* stats */
  .statsRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .stat { padding: 14px 16px; border-radius: var(--radius); background: var(--line-2); }
  .dark .stat { background: var(--line); }
  .stat .num { font: 600 20px/1 "Merriweather", serif; color: var(--text); }
  .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* warning banner (PENDING_DELETION) */
  .banner { padding: 14px 16px; border-radius: var(--radius); display: flex; gap: 12px; align-items: flex-start;
            margin-bottom: 20px; font-size: 13px; line-height: 1.5; }
  .banner.warn { background: var(--amber-soft); color: #92400e; border: 1px solid rgba(245,158,11,.25); }
  .dark .banner.warn { color: #fcd34d; }
  .banner.danger { background: var(--rose-soft); color: #9f1239; border: 1px solid rgba(244,63,94,.25); }
  .dark .banner.danger { color: #fda4af; }
  .banner h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius);
         font-size: 13px; font-weight: 500; border: 1px solid transparent; transition: background .15s, color .15s; }
  .btn.primary { background: var(--indigo); color: white; }
  .btn.primary:hover { background: var(--indigo-text); }
  .btn.secondary { background: var(--line-2); color: var(--text); }
  .dark .btn.secondary { background: var(--line); }
  .btn.secondary:hover { background: var(--line); }
  .dark .btn.secondary:hover { background: #52525b; }
  .btn.danger { background: var(--rose); color: white; }
  .btn.danger:hover { background: #e11d48; }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn.ghost:hover { color: var(--text); background: var(--line-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* form */
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field .hint { font-size: 11px; color: var(--sub); margin-top: 4px; }
  /* underline raw-input style from app.css */
  .raw-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
               border-radius: 0; padding: 8px 0; color: var(--text); outline: none; font: inherit;
               transition: border-color .2s; }
  .raw-input:focus { border-bottom-color: var(--emerald); }
  .raw-input::placeholder { color: var(--sub); font-weight: 300; }
  .raw-textarea { width: 100%; background: transparent; border: none; border-left: 2px solid var(--line);
                  padding: 8px 0 8px 16px; font-size: 13px; color: var(--muted); outline: none; resize: vertical;
                  min-height: 70px; font-family: inherit; transition: border-color .2s, color .2s; }
  .raw-textarea:focus { border-left-color: var(--emerald); color: var(--text); }

  /* segmented (theme) */
  .segmented { display: inline-flex; padding: 3px; background: var(--line-2); border-radius: 10px; gap: 2px; }
  .dark .segmented { background: var(--line); }
  .segmented button { padding: 6px 14px; border-radius: 8px; border: none; background: transparent;
                      color: var(--muted); font-size: 12px; font-weight: 500; }
  .segmented button.active { background: var(--bg-elev); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .dark .segmented button.active { background: #3f3f46; }

  /* select (preferences) */
  .select { width: 100%; background: transparent; border: 1px solid var(--line); border-radius: var(--radius);
            padding: 8px 12px; color: var(--text); font: inherit; outline: none; }
  .select:focus { border-color: var(--emerald); }

  /* connections list */
  .connRow { display: flex; align-items: center; justify-content: space-between; padding: 14px 0;
             border-bottom: 1px solid var(--line); }
  .connRow:last-child { border-bottom: none; }
  .connRow .meta { display: flex; align-items: center; gap: 12px; }
  .connRow .provIcon { width: 36px; height: 36px; border-radius: var(--radius); background: var(--line-2);
                       display: grid; place-items: center; font-size: 14px; }
  .dark .connRow .provIcon { background: var(--line); }
  .connRow .name { font-weight: 500; font-size: 13px; }
  .connRow .when { color: var(--muted); font-size: 11px; }

  /* danger zone */
  .danger-zone { border-color: rgba(244,63,94,.3); }
  .danger-zone .cardHead h2 { color: var(--rose); }
  .danger-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0;
                border-bottom: 1px solid var(--line); }
  .danger-row:last-child { border-bottom: none; }
  .danger-row .desc { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 540px; }

  /* JWT panel (compact, fixed bottom of sidebar / collapsible) */
  .creds { padding: 14px; border-top: 1px solid var(--line); }
  .creds details { width: 100%; }
  .creds summary { font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; list-style: none; }
  .creds summary::-webkit-details-marker { display: none; }
  .creds input, .creds textarea { width: 100%; margin-top: 8px; background: var(--line-2); border: 1px solid var(--line);
                                  border-radius: 6px; padding: 6px 8px; font: 11px/1.4 ui-monospace, Menlo, monospace;
                                  color: var(--text); outline: none; resize: vertical; }
  .dark .creds input, .dark .creds textarea { background: var(--line); }
  .creds .row { display: flex; gap: 6px; margin-top: 6px; }
  .creds .row button { flex: 1; padding: 5px; font-size: 11px; border-radius: 6px; border: 1px solid var(--line);
                       background: transparent; color: var(--text); }
  .creds .row button:hover { background: var(--line-2); }

  /* toast */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
           background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
           padding: 10px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
           transition: opacity .2s, transform .2s; pointer-events: none; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: rgba(244,63,94,.5); }
  #toast.ok { border-color: rgba(16,185,129,.5); }

  /* icons (heroicons-style line) */
  .icon { width: 20px; height: 20px; stroke-width: 1.5; }

  /* loading */
  .skeleton { background: linear-gradient(90deg, var(--line-2) 25%, var(--line) 50%, var(--line-2) 75%);
              background-size: 200% 100%; animation: sk 1.4s ease infinite; border-radius: 6px; }
  .dark .skeleton { background: linear-gradient(90deg, var(--line) 25%, #52525b 50%, var(--line) 75%); }
  @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body class="">
<div class="app">

  <!-- ─────── Sidebar (mirrors error-archive-fe AppSidebar) ─────── -->
  <nav class="sidebar">
    <div class="brand">E</div>
    <div class="nav">
      <a class="navItem" title="home"  href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg></a>

    </div>
    <button id="themeBtn" class="themeBtn" title="theme">
      <svg id="iconMoon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>

  <!-- ─────── Main column ─────── -->
  <div class="col">

      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/></svg>

    <main>
      <div class="wrap" id="view"></div>
    </main>
  </div>
</div>

<div id="toast"></div>

<!-- ─────── Templates ─────── -->
<template id="tpl-profile">

    <h1 class="serif">My Profile</h1>

  </div>

  <!-- status banners (filled dynamically) -->
  <div id="statusBanner"></div>

  <div class="card hoverable">

      <div class="avatar" id="heroAvatar">··</div>
      <div class="info">
        <h1 class="serif" id="heroName">—</h1>
        <div class="email" id="heroEmail">—</div>
        <span class="badge mute" id="heroStatus">—</span>
        <div class="bio" id="heroBio"></div>
        <div style="display:flex; gap:8px;">
          <a class="btn primary" href="#/settings">Edit Profile</a>

    <div class="statsRow">
      <div class="stat">
        <div class="num" id="statFollowers">—</div>

        <div class="num" id="statFollowing">—</div>
        <div class="lbl">following</div>
      </div>
      <div class="stat">
        <div class="num" id="statTheme">—</div>
        <div class="lbl">theme</div>
      </div>

      <h2>Preferences snapshot</h2>

      <div>language: <span id="sumLang" style="color:var(--text)">—</span></div>
      <div>timezone: <span id="sumTz" style="color:var(--text)">—</span></div>
      <div>theme: <span id="sumTheme" style="color:var(--text)">—</span></div>

<template id="tpl-settings">
  <div class="pageHead">
    <h1 class="serif">Settings</h1>

<template id="tpl-settings-profile">
  <div class="card">
    <div class="cardHead"><h2>Public profile</h2></div>
    <div class="field">
      <label>Display name</label>
      <input id="fDisplayName" class="raw-input" type="text" maxlength="50" placeholder="Your name" />
      <div class="hint">≤ 50자. 공개 프로필에 노출됨.</div>
    </div>
    <div class="field">
      <label>Avatar URL</label>
      <input id="fAvatarUrl" class="raw-input" type="text" placeholder="https://..." />
      <div style="margin-top:8px;">
        <button class="btn ghost sm" data-clear="avatar">clear avatar</button>
      </div>
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="fBio" class="raw-textarea" maxlength="300" placeholder="짧은 소개..."></textarea>
      <div style="margin-top:8px;">
        <button class="btn ghost sm" data-clear="bio">clear bio</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:16px;">
      <button class="btn secondary" id="resetProfile">reset</button>
      <button class="btn primary" id="saveProfile">Save changes</button>
    </div>
  </div>
</template>

<template id="tpl-settings-preferences">
  <div class="card">
    <div class="cardHead"><h2>Language &amp; Region</h2></div>
    <div class="field">
      <label>Language (BCP 47)</label>
      <select id="fLanguage" class="select">
        <option value="">— server default —</option>
        <option value="ko">한국어 (ko)</option>
        <option value="en">English (en)</option>
        <option value="ja">日本語 (ja)</option>
      </select>
    </div>
    <div class="field">
      <label>Timezone (IANA)</label>
      <select id="fTimezone" class="select">
        <option value="">— server default —</option>
        <option value="Asia/Seoul">Asia/Seoul</option>
        <option value="Asia/Tokyo">Asia/Tokyo</option>
        <option value="America/Los_Angeles">America/Los_Angeles</option>
        <option value="UTC">UTC</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="cardHead"><h2>Appearance</h2></div>
    <div class="field">
      <label>Theme</label>
      <div class="segmented" id="themeSeg">
        <button data-theme="LIGHT">Light</button>
        <button data-theme="DARK">Dark</button>
        <button data-theme="SYSTEM">System</button>
      </div>
      <div class="hint">SYSTEM 은 OS 설정을 따른다.</div>
    </div>
  </div>

  <div class="card">
    <div class="cardHead"><h2>Workspace</h2></div>
    <div class="field">
      <label>Default workspace ID</label>
      <input id="fDefaultWs" class="raw-input" type="number" placeholder="(개인 홈)" />
      <div class="hint">로그인 후 기본 진입 워크스페이스. 비우면 개인 홈.</div>
      <div style="margin-top:8px;"><button class="btn ghost sm" data-clear="ws">clear</button></div>
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:flex-end;">
    <button class="btn secondary" id="resetPrefs">reset</button>
    <button class="btn primary" id="savePrefs">Save preferences</button>
  </div>
</template>

<template id="tpl-settings-connections">
  <div class="card">
    <div class="cardHead">
      <h2>Connected accounts</h2>
      <span class="right">GET /users/me/connections</span>
    </div>
    <div id="connList">loading…</div>
  </div>
</template>

<template id="tpl-settings-account">
  <div class="card danger-zone">
    <div class="cardHead"><h2>Danger zone</h2></div>

    <div class="danger-row" id="rowDelete">
      <div>
        <div style="font-weight:500;font-size:13px;">Delete account</div>
        <div class="desc">탈퇴 요청 시 <b>PENDING_DELETION</b> 으로 30일 grace period. 그 기간 동안 복구 가능. 만료 시 PII 가 익명화된다.</div>
      </div>
      <button class="btn danger" id="btnDelete">Request deletion</button>
    </div>

    <div class="danger-row" id="rowRestore" style="display:none;">
      <div>
        <div style="font-weight:500;font-size:13px;">Cancel deletion</div>
        <div class="desc">탈퇴 요청을 취소하고 ACTIVE 로 돌아온다. PENDING_DELETION 상태일 때만 노출.</div>
      </div>
      <button class="btn secondary" id="btnRestore">Restore</button>
    </div>
  </div>
</template>

<script type="module">
(() => {
  // ───────────────────── creds & theme ─────────────────────
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const baseUrlEl = $('#baseUrl'), jwtEl = $('#jwt');
  baseUrlEl.value = localStorage.getItem('ac.baseUrl') || 'http://localhost:8000';
  jwtEl.value = localStorage.getItem('ac.jwt') || '';

  $('#saveCreds').onclick = () => {
    localStorage.setItem('ac.baseUrl', baseUrlEl.value.trim());
    localStorage.setItem('ac.jwt', jwtEl.value.trim());
    toast('creds saved', 'ok');
  };
  $('#reloadAll').onclick = () => render();

  // theme
  const root = document.documentElement;
  function applyTheme(theme) {
    const eff = theme === 'SYSTEM'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'DARK' : 'LIGHT')
      : theme;
    document.body.classList.toggle('dark', eff === 'DARK');
    $('#iconMoon').style.display = eff === 'DARK' ? 'none' : '';
    $('#iconSun').style.display  = eff === 'DARK' ? '' : 'none';
  }
  let currentThemePref = localStorage.getItem('ac.theme') || 'SYSTEM';
  applyTheme(currentThemePref);
  $('#themeBtn').onclick = () => {
    currentThemePref = document.body.classList.contains('dark') ? 'LIGHT' : 'DARK';
    localStorage.setItem('ac.theme', currentThemePref);
    applyTheme(currentThemePref);
  };

  // ───────────────────── fetch wrapper ─────────────────────
  async function api(method, path, body) {
    const base = baseUrlEl.value.trim().replace(/\/$/, '');
    const headers = { 'Accept': 'application/json' };
    const jwt = jwtEl.value.trim();
    if (jwt) headers['Authorization'] = 'Bearer ' + jwt;
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const res = await fetch(base + path, {
      method, headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    let parsed = null; try { parsed = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) {
      const e = new Error((parsed && (parsed.error || parsed.message)) || `HTTP ${res.status}`);
      e.status = res.status; throw e;
    }
    return parsed;
  }

  // ───────────────────── toast ─────────────────────
  const toastEl = $('#toast'); let toastTimer;
  function toast(msg, kind='') {
    toastEl.className = ''; toastEl.classList.add(kind); toastEl.textContent = msg;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // ───────────────────── shared state ─────────────────────
  let me = null;             // MyProfile
  let connections = null;    // Connection[]
  let followStatus = null;   // for me.userId

  async function loadMe() {
    me = await api('GET', '/api/v1/users/me');
    return me;
  }
  async function loadConnections() {
    try { connections = await api('GET', '/api/v1/users/me/connections'); }
    catch { connections = []; }
  }
  async function loadFollowStatus() {
    if (!me) return;
    try { followStatus = await api('GET', `/api/v1/users/${me.userId}/follow-status`); }
    catch { followStatus = null; }
  }

  // ───────────────────── status helpers ─────────────────────
  function statusBadge(status) {
    const map = {
      ACTIVE:           ['ok',     'Active'],
      PENDING_DELETION: ['warn',   'Pending deletion'],
      SUSPENDED:        ['danger', 'Suspended'],
      DELETED:          ['mute',   'Deleted'],
    };
    const [cls, label] = map[status] || ['mute', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function statusBanner(p) {
    if (!p) return '';
    if (p.status === 'PENDING_DELETION' && p.pendingDeletionAt) {
      const deadline = new Date(new Date(p.pendingDeletionAt).getTime() + 30 * 86400000);
      const days = Math.max(0, Math.ceil((deadline - Date.now()) / 86400000));
      return `<div class="banner warn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        <div style="flex:1;">
          <h3>탈퇴 진행 중 — D-${days}</h3>
          <div>${deadline.toLocaleDateString()} 이후 데이터가 영구 익명화됩니다. 지금 취소할 수 있습니다.</div>
        </div>
        <a class="btn secondary sm" href="#/settings/account">manage →</a>
      </div>`;
    }
    if (p.status === 'SUSPENDED') {
      return `<div class="banner danger">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M4.9 4.9l14.2 14.2"/></svg>
        <div>
          <h3>계정이 일시 정지되었습니다</h3>
          <div>문의가 필요하면 support@error-archive.dev 로 연락해주세요.</div>
        </div>
      </div>`;
    }
    return '';
  }

  function initialsOf(name) {
    if (!name) return '··';
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.slice(0, 2).toUpperCase();
  }

  // ───────────────────── router (hash) ─────────────────────
  const view = $('#view');
  function route() {
    const hash = location.hash || '#/profile';
    $$('.navItem').forEach(n => n.classList.remove('active'));
    if (hash.startsWith('#/settings')) {
      $('.navItem[data-route="settings"]').classList.add('active');
      renderSettings(hash);
    } else {
      $('.navItem[data-route="profile"]').classList.add('active');
      renderProfile();
    }
  }
  window.addEventListener('hashchange', route);

  // ───────────────────── Profile page ─────────────────────
  async function renderProfile() {
    view.innerHTML = $('#tpl-profile').innerHTML;
    // skeleton state — show muted dashes while fetching
    if (!me) { try { await loadMe(); } catch (e) { toast(`/users/me 실패: ${e.message}`, 'err'); return; } }
    if (!followStatus) { await loadFollowStatus(); }
    if (!connections) { await loadConnections(); }

    $('#statusBanner').innerHTML = statusBanner(me);

    $('#heroName').textContent = me.displayName || '—';
    $('#heroEmail').textContent = me.email || '— (email hidden)';
    $('#heroStatus').outerHTML = statusBadge(me.status);
    $('#heroBio').textContent = me.bio || '';
    if (me.avatarUrl) {
      $('#heroAvatar').innerHTML = `<img src="${me.avatarUrl}" alt="">`;
    } else {
      $('#heroAvatar').textContent = initialsOf(me.displayName);
    }

    $('#statFollowers').textContent = followStatus?.followersCount ?? '—';
    $('#statFollowing').textContent = followStatus?.followingCount ?? '—';
    $('#statTheme').textContent = (me.theme || 'SYSTEM').toLowerCase();

    $('#sumLang').textContent  = me.language || '(default)';
    $('#sumTz').textContent    = me.timezone || '(default)';
    $('#sumTheme').textContent = (me.theme || 'SYSTEM').toLowerCase();
    $('#sumWs').textContent    = me.defaultWorkspaceId ?? '(personal)';

    const connEl = $('#connPreview');
    if (!connections || !connections.length) {
      connEl.textContent = '연결된 계정 없음';
    } else {
      connEl.innerHTML = connections.slice(0, 3).map(c =>
        `<span style="display:inline-block;padding:4px 10px;margin-right:6px;background:var(--line-2);border-radius:8px;font-size:12px;">
           ${c.provider}${c.providerEmail ? ` · <span class="sub">${c.providerEmail}</span>` : ''}
         </span>`
      ).join('');
    }
  }

  // ───────────────────── Settings page ─────────────────────
  async function renderSettings(hash) {
    view.innerHTML = $('#tpl-settings').innerHTML;
    const sub = hash.split('/')[2] || 'profile';

    $$('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === sub);
      t.onclick = () => { location.hash = `#/settings/${t.dataset.tab}`; };
    });

    const body = $('#settingsBody');
    if (!me) { try { await loadMe(); } catch (e) { toast(`/users/me 실패: ${e.message}`, 'err'); return; } }

    if (sub === 'profile')        return renderSettingsProfile(body);
    if (sub === 'preferences')    return renderSettingsPreferences(body);
    if (sub === 'connections')    return renderSettingsConnections(body);
    if (sub === 'account')        return renderSettingsAccount(body);
  }

  function renderSettingsProfile(body) {
    body.innerHTML = $('#tpl-settings-profile').innerHTML;
    const f = {
      dn: $('#fDisplayName'), av: $('#fAvatarUrl'), bio: $('#fBio'),
    };
    function fill() {
      f.dn.value = me.displayName || '';
      f.av.value = me.avatarUrl || '';
      f.bio.value = me.bio || '';
    }
    fill();
    const clears = { avatar: false, bio: false };
    $$('[data-clear]', body).forEach(b => b.onclick = () => {
      const k = b.dataset.clear;
      if (k === 'avatar') { f.av.value = ''; clears.avatar = true; }
      if (k === 'bio')    { f.bio.value = ''; clears.bio = true; }
      toast(`${k} → null (저장 후 반영)`, '');
    });
    $('#resetProfile').onclick = () => { fill(); clears.avatar = clears.bio = false; };
    $('#saveProfile').onclick = async () => {
      const payload = {};
      if (f.dn.value && f.dn.value !== me.displayName) payload.displayName = f.dn.value;
      if (clears.avatar) payload.clearAvatar = true;
      else if (f.av.value && f.av.value !== me.avatarUrl) payload.avatarUrl = f.av.value;
      if (clears.bio) payload.clearBio = true;
      else if (f.bio.value && f.bio.value !== me.bio) payload.bio = f.bio.value;
      if (Object.keys(payload).length === 0) { toast('변경사항 없음', ''); return; }
      try {
        me = await api('PATCH', '/api/v1/users/me', payload);
        clears.avatar = clears.bio = false;
        fill();
        toast('프로필 저장됨', 'ok');
      } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
    };
  }

  function renderSettingsPreferences(body) {
    body.innerHTML = $('#tpl-settings-preferences').innerHTML;
    const f = { lang: $('#fLanguage'), tz: $('#fTimezone'), ws: $('#fDefaultWs') };
    const clears = { language: false, timezone: false, ws: false };

    function fill() {
      f.lang.value = me.language || '';
      f.tz.value = me.timezone || '';
      f.ws.value = me.defaultWorkspaceId ?? '';
      $$('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.theme === (me.theme || 'SYSTEM')));
    }
    fill();

    let theme = me.theme || 'SYSTEM';
    $$('#themeSeg button').forEach(b => b.onclick = () => {
      theme = b.dataset.theme;
      $$('#themeSeg button').forEach(x => x.classList.toggle('active', x === b));
    });

    $$('[data-clear]', body).forEach(b => b.onclick = () => {
      const k = b.dataset.clear;
      if (k === 'ws') { f.ws.value = ''; clears.ws = true; }
      toast(`${k} → null (저장 후 반영)`, '');
    });
    $('#resetPrefs').onclick = () => { fill(); theme = me.theme || 'SYSTEM'; for (const k in clears) clears[k] = false; };

    $('#savePrefs').onclick = async () => {
      const payload = {};
      if (f.lang.value !== (me.language || ''))
        f.lang.value ? payload.language = f.lang.value : payload.clearLanguage = true;
      if (f.tz.value !== (me.timezone || ''))
        f.tz.value ? payload.timezone = f.tz.value : payload.clearTimezone = true;
      if (theme !== me.theme) payload.theme = theme;
      if (clears.ws) payload.clearDefaultWorkspace = true;
      else if (f.ws.value && Number(f.ws.value) !== me.defaultWorkspaceId)
        payload.defaultWorkspaceId = Number(f.ws.value);

      if (Object.keys(payload).length === 0) { toast('변경사항 없음', ''); return; }
      try {
        me = await api('PATCH', '/api/v1/users/me', payload);
        if (payload.theme) { currentThemePref = payload.theme; localStorage.setItem('ac.theme', payload.theme); applyTheme(payload.theme); }
        clears.ws = false; fill();
        toast('환경설정 저장됨', 'ok');
      } catch (e) { toast('저장 실패: ' + e.message, 'err'); }
    };
  }

  async function renderSettingsConnections(body) {
    body.innerHTML = $('#tpl-settings-connections').innerHTML;
    const list = $('#connList');
    if (!connections) await loadConnections();
    if (!connections || !connections.length) {
      list.innerHTML = '<div class="sub" style="padding:12px 0;font-size:13px;">연결된 외부 계정이 없습니다.</div>';
      return;
    }
    list.innerHTML = connections.map(c => `
      <div class="connRow">
        <div class="meta">
          <div class="provIcon">${(c.provider || '?').slice(0,1).toUpperCase()}</div>
          <div>
            <div class="name">${escape(c.provider)}</div>
            <div class="when">${c.providerEmail ? escape(c.providerEmail) + ' · ' : ''}linked ${fmtDate(c.linkedAt)}</div>
          </div>
        </div>
        ${c.profileUrl ? `<a class="btn ghost sm" href="${escape(c.profileUrl)}" target="_blank" rel="noopener">view</a>` : ''}
      </div>
    `).join('');
  }

  function renderSettingsAccount(body) {
    body.innerHTML = $('#tpl-settings-account').innerHTML;
    const pending = me.status === 'PENDING_DELETION';
    $('#rowDelete').style.display = pending ? 'none' : '';
    $('#rowRestore').style.display = pending ? '' : 'none';

    $('#btnDelete').onclick = async () => {
      if (!confirm('정말 탈퇴 요청하시겠습니까?\n30일 grace period 시작 — 그 전엔 복구 가능.')) return;
      try {
        await api('DELETE', '/api/v1/users/me');
        me = await loadMe();
        renderSettingsAccount(body);
        toast('탈퇴 요청됨 — PENDING_DELETION', 'ok');
      } catch (e) { toast('실패: ' + e.message, 'err'); }
    };
    $('#btnRestore').onclick = async () => {
      try {
        await api('POST', '/api/v1/users/me/restore');
        me = await loadMe();
        renderSettingsAccount(body);
        toast('계정 복구됨 — ACTIVE', 'ok');
      } catch (e) { toast('실패: ' + e.message, 'err'); }
    };
  }

  // ───────────────────── utils ─────────────────────
  function escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[m]);
  }
  function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(); } catch { return iso; } }

  // ───────────────────── boot ─────────────────────
  function render() { me = null; connections = null; followStatus = null; route(); }
  if (!location.hash) location.hash = '#/profile';
  route();
})();
</script>
</body>
</html>
