# ===================================================================
# gateway 공통 베이스 (Spring Cloud Gateway Server MVC)
# - Spring Security oauth2ResourceServer 가 JWT 검증
# - HeaderInjectionFilter 가 X-User-Id 등 downstream 용 헤더 주입
# - SCG 가 prefix 매칭 라우팅 + CircuitBreaker / Retry 횡단 관심사
# ===================================================================

spring:
  application:
    name: gateway
  profiles:
    default: prod

server:
  forward-headers-strategy: framework

iam:
  jwt:
    audience: ${IAM_JWT_AUDIENCE:local-clients}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    gateway:
      access: read_only
  # 요청마다 traceId/spanId 를 만들어 로그 MDC 에 넣는다. 수집 서버로 보내는 건 env 로 켤 때만(로컬·테스트는 꺼짐).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: ${TRACING_EXPORT_ENABLED:false}
        endpoint: ${TRACING_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
