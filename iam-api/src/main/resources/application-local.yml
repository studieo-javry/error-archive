# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5432).
# - Secret: dev placeholder. git 에 들어가도 OK (실제 비밀이 아님).
# - HTTPS 아님: cookie secure=false, HTTP origin 허용.
# - DEBUG 로그.
# ===================================================================

spring:
  config:
    activate:
      on-profile: local

  flyway:
    enabled: false   # local: Hibernate(ddl-auto=update)로 스키마 관리 → Flyway off
  datasource:
    url: jdbc:postgresql://localhost:5432/iam_db
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update                         # 로컬은 자유롭게 스키마 변경
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      properties:
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000

  # 기본값 = MailHog(docker-compose, SMTP 1025 / web UI http://localhost:8025).
  # ENV 만 주면 로컬에서도 실제 외부 SMTP(Gmail/SES/SendGrid)로 발송 — 코드/프로파일 변경 불필요.
  #   예) Gmail:  IAM_MAIL_HOST=smtp.gmail.com IAM_MAIL_PORT=587 \
  #              IAM_MAIL_USERNAME=you@gmail.com IAM_MAIL_PASSWORD=<앱 비밀번호> \
  #              IAM_MAIL_SMTP_AUTH=true IAM_MAIL_STARTTLS=true \
  #              IAM_EMAIL_FROM_ADDRESS=you@gmail.com
  mail:
    host: ${IAM_MAIL_HOST:localhost}
    port: ${IAM_MAIL_PORT:1025}
    username: ${IAM_MAIL_USERNAME:}
    password: ${IAM_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${IAM_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${IAM_MAIL_STARTTLS:false}

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    root: info         # 바인딩 파라미터 확인용

# local 한정 actuator 노출. SecurityConfig 가 local profile 에서 /actuator/** permitAll.
# prod/stg 는 application.yml 기본 (health 만) 유지.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Activity event publisher 모드. `kafka` 면 outbox + relayer 가 user-activity.v1 발행.
# `http` (또는 그 외) 면 Noop fallback — 잔디 미발행 (사용자 follow 동작은 정상).
noti:
  publisher:
    mode: "${NOTI_PUBLISHER_MODE:kafka}"

iam:
  # Outbox + Relayer (adaptive polling).
  outbox:
    busy-delay-ms: 200
    idle-initial-delay-ms: 1000
    idle-max-delay-ms: 5000
    idle-multiplier: 2.0
    batch-size: 50
    max-attempts: 10
    base-backoff-ms: 5000
    max-backoff-ms: 3600000
    sent-ttl-days: 30
  jwt:
    secret: ${IAM_JWT_SECRET}
    issuer: "https://iam.local"
    audience: "local-clients"
  oauth:
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
  cookie:
    secure: false                              # localhost 는 HTTP
    same-site: Lax
    # domain 미지정 — localhost 만 사용
  workspace:
    invite-base-url: "http://localhost:5173/invitations"
  email:
    provider: ${IAM_EMAIL_PROVIDER:smtp}        # 기본 smtp(→MailHog). logging 으로 콘솔만도 가능
    from-address: ${IAM_EMAIL_FROM_ADDRESS:noreply@error-archive.local}
    from-name: ${IAM_EMAIL_FROM_NAME:Error Archive (local)}

