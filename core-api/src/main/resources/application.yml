# ===================================================================
# core-api 공통 베이스 — 모든 환경에서 동일한 값만.
# 환경별 차이는 application-{local|dev|stg|prod}.yml 에 분리.
# ===================================================================

spring:
  application:
    name: core-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  forward-headers-strategy: framework

iam:
  jwt:
    # 모든 환경 공통 (iam-api 가 발급한 토큰 검증용)
    audience: ${IAM_JWT_AUDIENCE:local-clients}

core:
  attachment:
    storage-path: ${CORE_ATTACHMENT_STORAGE_PATH:./var/attachments}
    public-base-url: ${CORE_ATTACHMENT_PUBLIC_BASE_URL:http://localhost:8080/api/v1/error-attachments}
  iam-api:
    base-url: ${CORE_IAM_API_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.security: DEBUG
