<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Debug Pulse · Error Archive</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────────────────
   *  Debug Pulse — Error Archive 잔디
   *  베이스: 다크 콘솔 (IDE/터미널 룩)
   *  색 스토리: 에러(burn red) → 디버깅(amber) → 해결의 실마리(teal) → 에메랄드 백열
   *  ───────────────────────────────────────────────────────────────────────── */
  :root {
    --bg: #0e0f12;
    --bg-elev: #16181d;
    --bg-deep: #0a0b0d;
    --text: #e5e7eb;
    --muted: #94979e;
    --sub: #6b6e76;
    --line: #2a2d34;
    --line-2: #1f2127;
    --accent: #10b981;
    --accent-soft: #064e3b;

    /* error → resolved 5단계 */
    --l0: #1a1c21;       /* 정적 상태 — 활동 없음 */
    --l1: #7f1d1d;       /* burn red — 단서 발견 */
    --l2: #b45309;       /* amber — 디버깅 중 */
    --l3: #0d9488;       /* teal — 해결의 실마리 */
    --l4: #10b981;       /* emerald — 해결됨 */
    --l4-glow: rgba(16, 185, 129, .55);

    /* 콘솔 ANSI 닷 컬러 */
    --ansi-red: #ef4444;
    --ansi-amber: #f59e0b;
    --ansi-teal: #14b8a6;
    --ansi-emerald: #10b981;

    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --radius: 10px;
  }
  .light {
    --bg: #f7f7f8;
    --bg-elev: #ffffff;
    --bg-deep: #ececef;
    --text: #18181b;
    --muted: #52525b;
    --sub: #a1a1aa;
    --line: #e4e4e7;
    --line-2: #f4f4f5;
    --accent-soft: #d1fae5;

    --l0: #ebedf0;
    --l1: #fecaca;
    --l2: #fcd34d;
    --l3: #5eead4;
    --l4: #10b981;
    --l4-glow: rgba(16, 185, 129, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; background: var(--bg); color: var(--text);
               font: 14px/1.5 "Inter", -apple-system, "Pretendard", sans-serif; }
  .mono { font-family: var(--mono); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px; }

  /* ─ header ─ */
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 26px; }
  .head h1 { font: 700 26px/1.1 var(--mono); margin: 0 0 6px;
             letter-spacing: -.5px; }
  .head h1 .prompt { color: var(--accent); margin-right: 8px; }
  .head h1 .blink { display: inline-block; width: 9px; height: 22px; background: var(--accent);
                    margin-left: 4px; animation: blink 1s steps(2) infinite; vertical-align: -3px; }
  @keyframes blink { 50% { opacity: 0; } }
  .head .sub { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .head .sub .comment { color: var(--sub); }

  /* ─ controls ─ */
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px;
              font-family: var(--mono); font-size: 11px; }
  .seg { display: inline-flex; background: var(--bg-elev); border: 1px solid var(--line);
         border-radius: 6px; padding: 2px; }
  .seg button { background: transparent; border: 0; padding: 4px 10px; font-size: 11px;
                color: var(--muted); border-radius: 4px; cursor: pointer; font-family: var(--mono); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  button.bare { font: 11px var(--mono); cursor: pointer; padding: 4px 10px; border-radius: 6px;
                border: 1px solid var(--line); background: var(--bg-elev); color: var(--text); }

  /* ─ stats row ─ */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--bg-elev); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px; position: relative; }
  .stat::before { content: ''; position: absolute; top: 14px; left: 14px;
                  width: 6px; height: 6px; border-radius: 50%; }
  .stat.dot-red::before    { background: var(--ansi-red);    box-shadow: 0 0 6px var(--ansi-red); }
  .stat.dot-amber::before  { background: var(--ansi-amber);  box-shadow: 0 0 6px var(--ansi-amber); }
  .stat.dot-teal::before   { background: var(--ansi-teal);   box-shadow: 0 0 6px var(--ansi-teal); }
  .stat.dot-emerald::before{ background: var(--ansi-emerald);box-shadow: 0 0 6px var(--ansi-emerald); }
  .stat .label { font: 500 10px/1 var(--mono); color: var(--muted);
                 text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
                 padding-left: 12px; }
  .stat .value { font: 600 24px/1.1 var(--mono); letter-spacing: -.5px; }
  .stat .value .unit { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .stat .meta { font: 10px/1.4 var(--mono); color: var(--sub); margin-top: 6px; }

  /* ─ grid card ─ */
  .panel { background: var(--bg-elev); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 18px; margin-bottom: 16px; position: relative; }
  .panel-head { font: 10px var(--mono); color: var(--muted); text-transform: uppercase;
                letter-spacing: 1.5px; margin-bottom: 12px; display: flex;
                justify-content: space-between; align-items: center; }
  .panel-head .right { color: var(--accent); }

  .month-labels { display: flex; padding-left: 22px; font: 9px var(--mono); color: var(--muted);
                  margin-bottom: 4px; height: 14px; position: relative; }
  .month-label { position: absolute; }

  .grid-row { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .day-labels { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px;
                font: 9px var(--mono); color: var(--muted); }
  .day-labels span { line-height: 11px; }
  .grid-wrap { overflow-x: auto; padding-bottom: 6px; }
  .grid { display: grid; grid-auto-flow: column;
          grid-template-rows: repeat(7, 11px); gap: 3px; }
  .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--l0);
          cursor: pointer; transition: transform .08s ease, box-shadow .15s ease; }
  .cell:hover { transform: scale(1.5); outline: 1px solid var(--accent); z-index: 2; position: relative; }
  .cell.l1 { background: var(--l1); }
  .cell.l2 { background: var(--l2); }
  .cell.l3 { background: var(--l3); }
  .cell.l4 { background: var(--l4); box-shadow: 0 0 5px var(--l4-glow); }
  .cell.future { background: transparent; cursor: default; }
  .cell.future:hover { transform: none; outline: none; box-shadow: none; }

  /* ─ legend ─ */
  .legend { display: flex; align-items: center; gap: 8px; margin-top: 14px;
            font: 10px var(--mono); color: var(--muted); }
  .legend .cells { display: flex; gap: 3px; }
  .legend .cell { cursor: default; }
  .legend .cell:hover { transform: none; outline: none; }
  .legend .arrow { color: var(--sub); }

  /* ─ tooltip (console log line style) ─ */
  .tip { position: absolute; background: var(--bg-deep);
         border: 1px solid var(--line); color: var(--text);
         padding: 6px 10px; border-radius: 4px; font: 11px var(--mono);
         pointer-events: none; white-space: nowrap; z-index: 100;
         box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .tip .ok { color: var(--accent); }
  .tip .fail { color: var(--ansi-red); }
  .tip .dim { color: var(--sub); }

  /* ─ day panel (terminal output style) ─ */
  .day-panel { background: var(--bg-deep); border: 1px solid var(--line);
               border-radius: 8px; padding: 14px; margin-top: 14px;
               display: none; font-family: var(--mono); font-size: 11px; }
  .day-panel.show { display: block; }
  .day-panel .head-line { color: var(--accent); margin-bottom: 8px; font-weight: 500; }
  .day-panel .head-line .meta { color: var(--muted); margin-left: 8px; font-weight: 400; }
  .day-panel .row { color: var(--text); padding: 2px 0; }
  .day-panel .row .arr { color: var(--sub); margin-right: 6px; }
  .day-panel .row .lvl { color: var(--accent); margin-right: 6px; }
  .day-panel .row .type { color: var(--ansi-teal); }
  .day-panel .row .count { color: var(--muted); }

  /* ─ side cards ─ */
  .grid2 { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }

  .stack-list { display: flex; flex-direction: column; gap: 6px;
                font-family: var(--mono); font-size: 11px; }
  .stack-row { display: grid; grid-template-columns: 1fr 60px 50px; gap: 8px;
               align-items: center; padding: 4px 0;
               border-bottom: 1px solid var(--line-2); }
  .stack-row:last-child { border: 0; }
  .stack-row .name { color: var(--text); }
  .stack-row .bar { background: var(--line-2); height: 5px; border-radius: 2px; overflow: hidden; }
  .stack-row .fill { background: var(--accent); height: 100%; }
  .stack-row .pct { color: var(--muted); text-align: right; font-size: 10px; }

  .weekday-bars { display: flex; flex-direction: column; gap: 5px;
                  font-family: var(--mono); font-size: 10px; }
  .weekday-bar { display: grid; grid-template-columns: 28px 1fr 32px;
                 align-items: center; gap: 8px; }
  .weekday-bar .bar { background: var(--line-2); height: 7px; border-radius: 2px;
                      position: relative; overflow: hidden; }
  .weekday-bar .fill { background: linear-gradient(90deg, var(--l2), var(--l3), var(--l4));
                       height: 100%; }
  .weekday-bar .lab { color: var(--muted); }
  .weekday-bar .val { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1><span class="prompt">$</span>debug-pulse<span class="blink"></span></h1>
      <div class="sub">
        <span class="comment">// 매일의 디버깅이 모인 1년의 흔적 — </span>error → resolved
      </div>
    </div>
    <div class="controls">
      <div class="seg">
        <button id="modeRel" class="on">relative</button>
        <button id="modeAbs">absolute</button>
      </div>
      <button class="bare" id="reseed">↻ reseed</button>
      <button class="bare" id="themeBtn">☀ light</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat dot-red">
      <div class="label">current streak</div>
      <div class="value"><span id="streakCur">—</span><span class="unit">d</span></div>
      <div class="meta" id="streakSince">—</div>
    </div>
    <div class="stat dot-amber">
      <div class="label">longest streak</div>
      <div class="value"><span id="streakLong">—</span><span class="unit">d</span></div>
      <div class="meta">// personal best</div>
    </div>
    <div class="stat dot-teal">
      <div class="label">active days</div>
      <div class="value" id="activeDays">—</div>
      <div class="meta">// last 12 months</div>
    </div>
    <div class="stat dot-emerald">
      <div class="label">resolutions</div>
      <div class="value"><span id="totalEvents">—</span></div>
      <div class="meta">score = <span id="totalScore">—</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span>// stacks resolved · last 12 months</span>
      <span class="right" id="bestDay"></span>
    </div>

    <div class="month-labels" id="monthLabels"></div>
    <div class="grid-row">
      <div class="day-labels">
        <span></span><span>Mon</span><span></span>
        <span>Wed</span><span></span><span>Fri</span><span></span>
      </div>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    </div>

    <div class="legend">
      <span class="arrow">error</span>
      <div class="cells">
        <div class="cell"></div>
        <div class="cell l1"></div>
        <div class="cell l2"></div>
        <div class="cell l3"></div>
        <div class="cell l4"></div>
      </div>
      <span class="arrow">resolved</span>
      <span style="margin-left:auto;" class="mono dim">click a day for details</span>
    </div>

    <div class="day-panel" id="dayPanel">
      <div class="head-line" id="dayPanelTitle"></div>
      <div id="dayPanelBody"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-head"><span>// activity breakdown</span></div>
      <div class="stack-list" id="breakdown"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span>// weekday avg score</span></div>
      <div class="weekday-bars" id="weekdayBars"></div>
    </div>
  </div>

</div>

<script>
  // ─────────────────────────────────────────────────────────────────────────
  // mock data generator — 백엔드 wiring 전 디자인 검증용
  // ─────────────────────────────────────────────────────────────────────────
  const ACTIVITY_WEIGHTS = {
    CASE_CREATED: 5, CASE_PUBLISHED: 3, STEP_ADDED: 2, SOLUTION_ADDED: 5,
    COMMENT_POSTED: 2, COMMENT_REACTION: 1, COMMENT_HELPFUL: 1, FOLLOWED_USER: 1,
  };
  const ACTIVITY_LABELS = {
    CASE_CREATED: 'case.created', CASE_PUBLISHED: 'case.published',
    STEP_ADDED: 'step.added', SOLUTION_ADDED: 'solution.added',
    COMMENT_POSTED: 'comment.posted', COMMENT_REACTION: 'comment.reaction',
    COMMENT_HELPFUL: 'comment.helpful', FOLLOWED_USER: 'user.followed',
  };

  function dateKey(d) { return d.toISOString().slice(0,10); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeekSun(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }

  function generateMock() {
    const today = new Date(); today.setHours(0,0,0,0);
    const end = today;
    const start = addDays(today, -363);
    const gridStart = startOfWeekSun(start);
    const days = [];
    for (let d = new Date(gridStart); d <= end; d = addDays(d, 1)) {
      const r = Math.random();
      let nEvents = 0, breakdown = {}, score = 0;
      if (d < start) { /* range 밖 */ }
      else if (r > 0.65) {
        nEvents = (r > 0.9) ? 4 + Math.floor(Math.random()*8)
                 : (r > 0.8) ? 2 + Math.floor(Math.random()*4)
                 : 1 + Math.floor(Math.random()*2);
        const types = Object.keys(ACTIVITY_WEIGHTS);
        for (let i = 0; i < nEvents; i++) {
          const t = types[Math.floor(Math.random()*types.length)];
          breakdown[t] = (breakdown[t] || 0) + 1;
          score += ACTIVITY_WEIGHTS[t];
        }
      }
      days.push({
        date: dateKey(d),
        inRange: d >= start && d <= end,
        future: d > end,
        count: nEvents, score, breakdown,
      });
    }
    return { gridStart, start, end, days };
  }

  function computeLevels(days, mode) {
    const scores = days.filter(d => d.inRange && d.score > 0).map(d => d.score).sort((a,b)=>a-b);
    let t1, t2, t3, t4;
    if (mode === 'relative' && scores.length) {
      const q = p => scores[Math.floor((scores.length - 1) * p)];
      t1 = 1; t2 = q(0.25); t3 = q(0.5); t4 = q(0.75);
    } else {
      t1 = 1; t2 = 5; t3 = 12; t4 = 24;
    }
    days.forEach(d => {
      if (!d.inRange || d.score === 0) d.level = 0;
      else if (d.score >= t4) d.level = 4;
      else if (d.score >= t3) d.level = 3;
      else if (d.score >= t2) d.level = 2;
      else d.level = 1;
    });
    return { t1, t2, t3, t4 };
  }

  function computeStreak(days) {
    const inRange = days.filter(d => d.inRange);
    let current = 0, currentStart = null;
    for (let i = inRange.length - 1; i >= 0; i--) {
      if (inRange[i].count > 0) {
        current++; currentStart = inRange[i].date;
      } else break;
    }
    let longest = 0, run = 0;
    inRange.forEach(d => { if (d.count > 0) { run++; longest = Math.max(longest, run); } else { run = 0; } });
    return { current, longest, currentStart };
  }

  // ─────────────────────────────────────────────────────────────────────────
  // render
  // ─────────────────────────────────────────────────────────────────────────
  let state = null, mode = 'relative';

  function render() {
    if (!state) state = generateMock();
    computeLevels(state.days, mode);
    const streak = computeStreak(state.days);

    const grid = document.getElementById('grid'); grid.innerHTML = '';
    state.days.forEach(d => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (d.future ? ' future' : d.level ? ' l' + d.level : '');
      if (!d.future) {
        cell.dataset.date = d.date;
        cell.dataset.score = d.score;
        cell.dataset.count = d.count;
        cell.dataset.level = d.level;
        cell.addEventListener('mouseenter', showTip);
        cell.addEventListener('mouseleave', hideTip);
        cell.addEventListener('click', () => showDayPanel(d));
      }
      grid.appendChild(cell);
    });

    const ml = document.getElementById('monthLabels'); ml.innerHTML = '';
    const weeks = Math.ceil(state.days.length / 7);
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      const firstDay = state.days[w * 7];
      if (!firstDay) continue;
      const month = new Date(firstDay.date).getMonth();
      if (month !== lastMonth) {
        const label = document.createElement('div');
        label.className = 'month-label';
        label.textContent = monthNames[month];
        label.style.left = (w * 14) + 'px';
        ml.appendChild(label);
        lastMonth = month;
      }
    }

    const inRange = state.days.filter(d => d.inRange);
    const totalEvents = inRange.reduce((s,d)=>s+d.count, 0);
    const totalScore = inRange.reduce((s,d)=>s+d.score, 0);
    const activeDays = inRange.filter(d => d.count > 0).length;
    document.getElementById('streakCur').textContent = streak.current;
    document.getElementById('streakSince').textContent = streak.currentStart
      ? `// since ${streak.currentStart}` : '// no active streak';
    document.getElementById('streakLong').textContent = streak.longest;
    document.getElementById('activeDays').textContent = `${activeDays}/${inRange.length}`;
    document.getElementById('totalEvents').textContent = totalEvents.toLocaleString();
    document.getElementById('totalScore').textContent = totalScore.toLocaleString();

    const best = inRange.reduce((a,b)=> b.score > (a?.score || 0) ? b : a, null);
    document.getElementById('bestDay').textContent =
      best ? `▲ peak ${best.date} · ${best.score} pts` : '';

    const totals = {};
    inRange.forEach(d => Object.entries(d.breakdown).forEach(([t,n]) => totals[t] = (totals[t]||0)+n));
    const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
    const sumCount = sorted.reduce((s,[,n])=>s+n, 0) || 1;
    const max = sorted[0]?.[1] || 1;
    document.getElementById('breakdown').innerHTML = sorted.map(([t,n]) => `
      <div class="stack-row">
        <span class="name">${ACTIVITY_LABELS[t]}</span>
        <div class="bar"><div class="fill" style="width:${100*n/max}%"></div></div>
        <span class="pct">${n} · ${(100*n/sumCount).toFixed(0)}%</span>
      </div>`).join('') || '<div class="pct">// no activity</div>';

    const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const sums = [0,0,0,0,0,0,0], counts = [0,0,0,0,0,0,0];
    inRange.forEach(d => { const dow = new Date(d.date).getDay(); sums[dow] += d.score; counts[dow]++; });
    const avgs = sums.map((s,i) => counts[i] ? s/counts[i] : 0);
    const maxAvg = Math.max(...avgs, 0.01);
    document.getElementById('weekdayBars').innerHTML = wd.map((d,i) => `
      <div class="weekday-bar">
        <span class="lab">${d}</span>
        <div class="bar"><div class="fill" style="width:${100*avgs[i]/maxAvg}%"></div></div>
        <span class="val">${avgs[i].toFixed(1)}</span>
      </div>`).join('');
  }

  // ─────────────────────────────────────────────────────────────────────────
  // tooltip — terminal log line style
  // ─────────────────────────────────────────────────────────────────────────
  let tip;
  function showTip(e) {
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); }
    const c = +e.currentTarget.dataset.count;
    const s = +e.currentTarget.dataset.score;
    const d = e.currentTarget.dataset.date;
    const lv = +e.currentTarget.dataset.level;
    if (c === 0) {
      tip.innerHTML = `<span class="dim">[${d}]</span> <span class="dim">·</span> no activity`;
    } else {
      const tag = lv === 4 ? '<span class="ok">RESOLVED</span>'
                 : lv === 3 ? '<span class="ok">progressing</span>'
                 : lv === 2 ? '<span style="color:var(--ansi-amber)">debugging</span>'
                 : '<span class="fail">errored</span>';
      tip.innerHTML = `<span class="dim">[${d}]</span> ${tag} ${c} stack${c>1?'s':''} · <span class="dim">score=</span>${s}`;
    }
    const r = e.currentTarget.getBoundingClientRect();
    tip.style.left = (r.left + r.width/2 + window.scrollX - tip.offsetWidth/2) + 'px';
    tip.style.top = (r.top + window.scrollY - tip.offsetHeight - 8) + 'px';
  }
  function hideTip() { if (tip) tip.remove(); tip = null; }

  // ─────────────────────────────────────────────────────────────────────────
  // day panel — terminal output style
  // ─────────────────────────────────────────────────────────────────────────
  function showDayPanel(d) {
    const p = document.getElementById('dayPanel');
    if (d.count === 0) { p.classList.remove('show'); return; }
    p.classList.add('show');
    const lvLabel = ['idle','errored','debugging','progressing','RESOLVED'][d.level];
    document.getElementById('dayPanelTitle').innerHTML =
      `$ debug-pulse --date=${d.date} <span class="meta">// level=${lvLabel} · score=${d.score}</span>`;
    document.getElementById('dayPanelBody').innerHTML =
      Object.entries(d.breakdown).map(([t,n]) =>
        `<div class="row"><span class="arr">▸</span><span class="lvl">[${lvLabel}]</span><span class="type">${ACTIVITY_LABELS[t]}</span> <span class="count">× ${n}</span></div>`
      ).join('');
  }

  // ─────────────────────────────────────────────────────────────────────────
  // controls
  // ─────────────────────────────────────────────────────────────────────────
  document.getElementById('modeRel').onclick = () => {
    mode = 'relative';
    document.getElementById('modeRel').classList.add('on');
    document.getElementById('modeAbs').classList.remove('on');
    render();
  };
  document.getElementById('modeAbs').onclick = () => {
    mode = 'absolute';
    document.getElementById('modeAbs').classList.add('on');
    document.getElementById('modeRel').classList.remove('on');
    render();
  };
  document.getElementById('reseed').onclick = () => { state = null; render(); };
  document.getElementById('themeBtn').onclick = () => {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    document.getElementById('themeBtn').textContent = isLight ? '🌙 dark' : '☀ light';
    localStorage.setItem('dp.theme', isLight ? 'LIGHT' : 'DARK');
  };
  if (localStorage.getItem('dp.theme') === 'LIGHT') {
    document.body.classList.add('light');
    document.getElementById('themeBtn').textContent = '🌙 dark';
  }

  render();
</script>
</body>
</html>
