# ===================================================================
# test — 단위/통합 테스트 전용.
# - DB: H2 in-memory(PG 호환 모드). docker 없이 부팅.
# - 활성화: @ActiveProfiles("test") 로 명시. CI/로컬 동일.
# - main application.yml(공통) 위에 덮인다.
# ===================================================================

spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false   # test: H2 + Hibernate create-drop 로 스키마 관리 → Flyway off (PG 전용 DDL 회피)
  datasource:
    url: "jdbc:h2:mem:iam-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

iam:
  jwt:
    secret: "test-secret-test-secret-test-secret-test-secret-test-secret-test-secret"
    issuer: "https://iam.test.local"
    audience: "test-clients"
  oauth:
    github:
      client-id: "test-client-id"
      client-secret: "test-client-secret"
  cookie:
    secure: false
    same-site: Lax
  workspace:
    invite-base-url: "https://app.test.local/invitations"

