# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5434, noti_db)
# - JWT: gateway 가 보낸 internal JWT 검증 (aud=noti-api)
# - 8082 포트로 바인드 (gateway=8000, iam=8080, core=8081 다음)
# ===================================================================

server:
  port: 8082

spring:
  config:
    activate:
      on-profile: local

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    consumer:
      group-id: noti-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  # SMTP — 로컬 mailhog. ENV 로 실제 SES/SendGrid 로 즉시 전환.
  mail:
    host: "${NOTI_MAIL_HOST:localhost}"
    port: "${NOTI_MAIL_PORT:1026}"
    username: "${NOTI_MAIL_USERNAME:}"
    password: "${NOTI_MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: "${NOTI_MAIL_SMTP_AUTH:false}"
      mail.smtp.starttls.enable: "${NOTI_MAIL_STARTTLS:false}"

  flyway:
    enabled: false   # local: Hibernate(ddl-auto=update)로 스키마 관리 → Flyway off
  datasource:
    url: jdbc:postgresql://localhost:5434/noti_db
    username: noti
    password: ${NOTI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG

# 내부 서비스 인증
#   verifier  — gateway / core-api 가 보낸 토큰(aud=noti-api) 검증
