# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5433, core_db)
# - JWT: iam-api 와 동일한 secret (local 평문 placeholder)
# - 8081 포트로 바인드 (iam-api 가 8080 점유)
#
# ⚠️  필수 환경변수 (없으면 부팅 실패):
#     CORE_DB_USERNAME, CORE_DB_PASSWORD
#     IAM_JWT_SECRET                       (≥ 64자, iam-api 와 동일)
#     CORE_INTERNAL_AUTH_PRIVATE_KEY_PEM   (RSA 비밀키, multiline)
# ===================================================================

server:
  port: 8081

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5433/core_db
    username: ${CORE_DB_USERNAME}
    password: ${CORE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
      properties:
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG

iam:
  jwt:
    secret: ${IAM_JWT_SECRET}
    issuer: "https://iam.local"
    audience: "local-clients"

core:
  attachment:
    storage-path: "./var/attachments"
    public-base-url: "http://localhost:8081/api/v1/error-attachments"
  iam-api:
    base-url: "http://localhost:8080"
  noti-api:
    base-url: "http://localhost:8082"

noti:
  publisher:
    mode: "${NOTI_PUBLISHER_MODE:kafka}"

