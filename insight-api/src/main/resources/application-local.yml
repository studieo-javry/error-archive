# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5435, insight_db)
# - Kafka: noti-api 의 docker-compose 가 띄운 broker 를 *공유* (localhost:9094)
#   - noti-api 와 insight-api 둘 다 같은 broker 사용 — 환경 단순화
# - 8083 포트로 바인드 (gateway=8000, iam=8080, core=8081, noti=8082 다음)
# ===================================================================

server:
  port: 8083

spring:
  config:
    activate:
      on-profile: local

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    consumer:
      group-id: insight-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://localhost:5435/insight_db
    username: insight
    password: insight_local_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG

