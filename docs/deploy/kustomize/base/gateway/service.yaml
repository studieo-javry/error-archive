apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  # Local 이어야 파드가 실제 소켓 피어를 본다. Cluster 에서는 피어가 클러스터 내부 IP(10.42.x)로 SNAT 되어
  # trusted-proxies(10.0.0.0/24) 밖이 되고, ClientIpResolver 가 XFF 를 무시해 모든 사용자가 한 버킷
  # (ratelimit:*|10.42.0.1)을 나눠 쓴다. Local 에서는 gateway 파드가 있는 노드의 NodePort 만 응답한다.
  externalTrafficPolicy: Local
  selector: { app: gateway }
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
