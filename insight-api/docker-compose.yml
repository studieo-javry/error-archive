# insight-api 전용 인프라 — PostgreSQL 만.
# Kafka broker 는 noti-api/docker-compose.yml 의 것을 *공유* (localhost:9094) — 같이 띄울 것.
services:
  insight-postgres:
    image: postgres:16-alpine
    container_name: insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insight_db
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight_local_pw   # dev only
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5435:5432"
    volumes:
      - insight-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  insight-postgres-data:
    name: insight-postgres-data
