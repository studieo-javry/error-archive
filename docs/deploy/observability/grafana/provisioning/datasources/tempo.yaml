apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # 추적 화면에서 같은 traceId 의 로그로 바로 이동
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{namespace=~"apps|platform"} |= "$${__trace.traceId}"'
      nodeGraph:
        enabled: true
