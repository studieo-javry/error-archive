# ===================================================================
# local — 개발자 로컬 머신.
# - DB: docker-compose 의 PostgreSQL (localhost:5435, insight_db)
# - Kafka: noti-api 의 docker-compose 가 띄운 broker 를 *공유* (localhost:9094)
#   - noti-api 와 insight-api 둘 다 같은 broker 사용 — 환경 단순화
# - 8083 포트로 바인드 (gateway=8000, iam=8080, core=8081, noti=8082 다음)
# ===================================================================

server:
  port: 8083

spring:
  config:
    activate:
      on-profile: local

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    consumer:
      group-id: insight-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  datasource:
    url: jdbc:postgresql://localhost:5435/insight_db
    username: insight
    password: insight_local_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    org.studieojavry: DEBUG
    org.hibernate.SQL: DEBUG

# 내부 서비스 인증
#   verifier — gateway / core-api / iam-api 가 보낸 토큰(aud=insight-api) 검증
#   issuer   — insight-api 가 iam-api 로 user timezone 조회 시 발급 (aud=iam-api)
internal-auth:
  ttl-seconds: 60
  issuer:
    name: insight-api
    key-id: insight-api-local-1
    # 실 PEM 은 .env.local 의 INSIGHT_API_INTERNAL_AUTH_PRIVATE_KEY_PEM 에 (gitignored).
    private-key-pem: ${INSIGHT_API_INTERNAL_AUTH_PRIVATE_KEY_PEM}
  verifier:
    audience: insight-api
    known-issuers:
      # 실 PEM 은 .env.local 의 INSIGHT_API_VERIFIER_*_PUBLIC_KEY_PEM 에 (gitignored).
      gateway: ${INSIGHT_API_VERIFIER_GATEWAY_PUBLIC_KEY_PEM}
      core-api: ${INSIGHT_API_VERIFIER_CORE_API_PUBLIC_KEY_PEM}

# local 한정 actuator 노출. SecurityConfig 가 local profile 에서 /actuator/** permitAll.
# prod/stg 는 application.yml 기본 (health 만) 유지.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
