global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: error-archive
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node-exporter
    static_configs:
      - targets: ["10.0.0.47:9100", "10.0.0.118:9100"]
        labels: {}
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["10.0.0.47:30990"]   # KSM NodePort — 실행 중이던 설정과 맞춤(hostNetwork 8080 도 응답)
  - job_name: node-exporter-dbvm
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: "dbvm-10.0.0.183" }
  - job_name: kafka-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["kafka-exporter:9308"]
  # 외부 헬스체크 — blackbox 가 대신 호출. instance = 확인한 주소.
  - job_name: blackbox-http
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_2xx] }
    # site = 대시보드·알림에 보일 이름
    static_configs:
      - targets: ["https://error-archive.com/"]
        labels: { site: "FE 사이트" }
      - targets: ["https://api.error-archive.com/internal/actuator/health"]
        labels: { site: "API 게이트웨이" }
      - targets: ["https://api.error-archive.com/api/v1/publishments/public"]
        labels: { site: "API 전체 경로 (gateway→publish→DB)" }
      - targets: ["https://stream.error-archive.com:30443/internal/actuator/health"]   # LE 인증서 수동 갱신
        labels: { site: "실시간 알림 (stream)" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
