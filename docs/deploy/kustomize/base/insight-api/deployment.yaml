apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-api
  labels: { app: insight-api }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: insight-api }
  template:
    metadata:
      labels: { app: insight-api }
    spec:
      nodeSelector: { role: apps }
      volumes:
        - name: insight-weights
          configMap: { name: insight-weights }   # git 밖(kubectl 로 생성)
      containers:
        - name: insight-api
          image: insight-api
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef: { name: insight-api-env, key: SPRING_PROFILES_ACTIVE }
            - name: INSIGHT_WEIGHTS_FILE
              value: /config/weights-prod.yml
          envFrom:
            - secretRef:    { name: insight-api-secrets }
            - configMapRef: { name: insight-api-env }
          volumeMounts:
            - { name: insight-weights, mountPath: /config, readOnly: true }
          readinessProbe:
            httpGet: { path: /internal/actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          startupProbe:                          # ARM 콜드스타트+다중 JVM 경합 대비: 기동 완료 전 liveness 가 죽이는 것 방지
            httpGet: { path: /internal/actuator/health/liveness, port: 8083 }
            periodSeconds: 5
            failureThreshold: 60                  # 최대 ~300s (정상 콜드스타트 25~150s 커버, 여유 2x)
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /internal/actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits:   { memory: "640Mi" }
