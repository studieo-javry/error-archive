# ===================================================================
# test — contextLoads 검증용. 외부 서비스 모두 불요.
# DB 는 H2 in-memory + Postgres 모드, Kafka 는 빈 등록만 (broker 없음 — 빈 생성 자체는 OK)
# internal-auth issuer/verifier 는 자체 포함된 키 한 쌍
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:insight-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:1
    consumer:
      group-id: insight-api-test

insight:
  iam-api:
    base-url: "http://localhost:8080"
  activity:
    weights:
      CASE_CREATED:     5
      CASE_PUBLISHED:   3
      STEP_ADDED:       2
      SOLUTION_ADDED:   5
      COMMENT_POSTED:   2
      COMMENT_REACTION: 1
      COMMENT_HELPFUL:  1
      FOLLOWED_USER:    1

