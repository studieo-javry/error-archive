# 분산 추적 저장소(단일 노드, 로컬 디스크). 앱(Brave) → Zipkin v2 JSON → :9411. Grafana 는 http://tempo:3200 으로 조회.
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    zipkin:
      endpoint: 0.0.0.0:9411
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 72h          # 추적 3일 보존 (로그 7일·메트릭 15일보다 짧게 — 용량이 가장 큼)
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
