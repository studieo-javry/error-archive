# base/redis/deployment.yaml — 분산 캐시(L2) + rate-limit 공유 버킷 + SSE pub/sub 용 Redis (self-host).
# 캐시/버킷/pub-sub 전용 → 영속화 off(원본은 항상 DB/iam). 앱(role=apps)과 같은 노드에 둬 크로스노드 홉 제거.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      nodeSelector:
        role: apps                 # core/noti 와 같은 노드 → same-node 통신(크로스노드 netpol 회피)
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "320Mi" }
