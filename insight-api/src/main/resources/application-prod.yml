# ===================================================================
# prod — production.
# - DB/키는 ENV/Secret 주입(평문 금지).
# - ddl-auto: validate. 스키마 변경은 Flyway(db/migration)로만.
# - iam-api base-url / activity weights / retention 은 base application.yml.
# ===================================================================

spring:
  config:
    activate:
      on-profile: prod
    # 활동 가중치 실 튜닝값 — 공개 저장소에 두지 않음(gitignore). 배포 시 ConfigMap 을 이 경로로 마운트.
    #   non-optional: 파일이 없으면 부팅 실패(fail-loud). 마운트 누락을 조용히 "전부 1(균등가중)"으로 흘리지 않기 위함.
    #   경로 override: INSIGHT_WEIGHTS_FILE (기본 ./config/weights-prod.yml, 실행 작업디렉토리 기준).
    import: "file:${INSIGHT_WEIGHTS_FILE:./config/weights-prod.yml}"

  flyway:
    enabled: true
    baseline-on-migrate: false   # 신규 DB 전제. 기존 스키마 위 도입 시 true + baseline-version

  datasource:
    url: ${INSIGHT_DB_URL}
    username: ${INSIGHT_DB_USERNAME}
    password: ${INSIGHT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ★ 무료티어 PG 1인스턴스(max_connections=100) 5개 서비스 공유 → 풀 합계 100 미만 필수(core18/iam15/publish·noti·insight10 = 63).
      maximum-pool-size: 10       # insight = 컨슈머 + KPI/잔디 조회
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate           # ★ 절대 update/create 금지
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: insight-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

# 내부 서비스 인증 — 키는 ENV 주입(평문 금지).
internal-auth:
  ttl-seconds: 60
  issuer:
    name: insight-api
    key-id: ${INSIGHT_INTERNAL_ISSUER_KEY_ID:insight-api}
    private-key-pem: ${INSIGHT_INTERNAL_ISSUER_PRIVATE_KEY}
  verifier:
    audience: insight-api
    known-issuers:
      gateway: ${INTERNAL_AUTH_GATEWAY_PUBLIC_KEY}
      core-api: ${INTERNAL_AUTH_CORE_API_PUBLIC_KEY}

# I2: insight → iam-api(사용자 timezone 조회 → 잔디 일자 계산) 대상. prod 필수 env(기본값 없이 강제).
#     미설정 시 부팅 실패로 조기 발견 — localhost fallback → UTC 로 잔디가 하루 어긋나는 것 방지.
insight:
  iam-api:
    base-url: ${INSIGHT_IAM_API_BASE_URL}

logging:
  level:
    root: WARN
    org.studieojavry: INFO
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true                    # I1: /health/liveness, /health/readiness (k8s 프로브)

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
