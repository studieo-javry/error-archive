apiVersion: 1
providers:
  - name: llm-dashboards
    orgId: 1
    folder: LLM
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
  - name: infra-dashboards
    orgId: 1
    folder: Infra
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infra
