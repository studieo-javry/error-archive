# ===================================================================
# test — contextLoads 검증용. 외부 서비스(Kafka/IAM/Noti) 모두 *불요*.
# - noti.publisher.mode=http → KafkaNotificationPublisherAdapter 비활성 (KafkaTemplate 빈 불요)
# - DB 는 H2 in-memory (PostgreSQL dialect 지정)
# - JWT secret/iam 은 base application.yml 의 ENV placeholder 대신 박힌 값
# ===================================================================

spring:
  flyway:
    enabled: false   # test: H2 + Hibernate create-drop 로 스키마 관리 → Flyway off (PG 전용 DDL 회피)
  datasource:
    url: jdbc:h2:mem:core-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

iam:
  jwt:
    secret: "test-secret-test-secret-test-secret-test-secret-test-secret-test-secret-1234"
    issuer: "https://iam.test"
    audience: "test-clients"

noti:
  publisher:
    mode: http

core:
  # base yml 이 core.attachment.s3.* 의 기본값을 없애(fail-fast) → test 는 여기서 concrete 값 제공.
  # 실제 스토리지 접속 없이 contextLoads(빈 바인딩)만 통과시키면 되므로 더미 값이면 충분.
  attachment:
    s3:
      bucket: "error-archive-attachments-test"
      region: "us-east-1"
      endpoint-internal: "http://localhost:9000"
      endpoint-public: "http://localhost:9000"
      path-style: true
      access-key: "test-access"
      secret-key: "test-secret"
  iam-api:
    base-url: "http://localhost:8080"   # base yml 에 기본값 없음 → test 는 여기서 제공
  noti-api:
    base-url: "http://localhost:8082"

