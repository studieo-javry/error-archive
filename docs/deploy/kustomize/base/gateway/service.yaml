apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  # 파드가 실제 접속 IP 를 보려면 Local 이어야 한다(ClientIpResolver 참고).
  # Local 이면 파드가 있는 노드만 응답하므로, OCI LB 백엔드는 role=platform 노드여야 한다.
  externalTrafficPolicy: Local
  selector: { app: gateway }
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
