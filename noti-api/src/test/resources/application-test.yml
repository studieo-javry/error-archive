# ===================================================================
# test — contextLoads 검증용. 외부 서비스(Kafka/IAM/SMTP) 불요.
# - DB: H2 in-memory (PostgreSQL 모드), Hibernate create-drop → Flyway off
# - Kafka: bootstrap localhost:1 (consumer 컨테이너는 연결 실패해도 컨텍스트 로드엔 무해)
# - email=logging, push=off 로 외부 발송 어댑터 비활성
# - internal-auth 키는 local dev 테스트 키 재사용 (아래 블록은 local yml 과 동일)
# ===================================================================

spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

  datasource:
    url: "jdbc:h2:mem:noti-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: localhost:1
    consumer:
      group-id: noti-api-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

# base yml 이 fail-fast(기본값 제거)로 바뀌어, 아래 값들을 test 프로파일이 concrete 로 제공해야 함.
iam:
  jwt:
    audience: noti-api

noti:
  iam-api:
    base-url: "http://localhost:8080"   # base yml 에 기본값 없음 → test 는 여기서 제공
  email:
    provider: logging
    from-address: "noreply@error-archive.test"
    from-name: "Error Archive"
  push:
    enabled: false
    provider: logging

