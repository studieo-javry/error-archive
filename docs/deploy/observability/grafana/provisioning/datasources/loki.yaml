apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # 로그 줄의 [traceId,spanId] 에서 traceId 를 뽑아 Tempo 추적으로 연결
      derivedFields:
        - name: traceId
          matcherRegex: '\[([0-9a-f]{16,32}),[0-9a-f]{16}\]'
          datasourceUid: tempo
          url: '$${__value.raw}'
