apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# stg 환경(=alpha 브랜치). 네임스페이스 apps.
# 주의: 현재 배포는 prod 스프링 프로파일 + .env.prod 로 동작 → 여기 SPRING_PROFILES_ACTIVE=prod 유지.
namespace: apps

resources:
- ../../base/iam-api
- ../../base/core-api
- ../../base/noti-api
- ../../base/insight-api
- ../../base/publish-api
- ../../base/redis

  # 로그인 없이 둘러보기(게스트 데모) 활성 — iam 이 게스트 토큰 발급 + 데모 봇/WS 부트스트랩 + 야간 게스트 정리.
  # 분산 캐시(workspace-role·iam-user-profile + 대시보드) 공유. 같은 apps ns 의 redis Service.
  # 게스트 데모 콘텐츠 wipe+reseed(야간) 활성. 데모 WS/봇 ID 는 iam /internal/demo/identity 로 조회.
  # SSE 노드 간 pub/sub fan-out 용. 같은 apps ns 의 redis Service.
configMapGenerator:
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - DEMO_ENABLED=true
  name: iam-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - DEMO_ENABLED=true
  name: core-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  name: noti-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: insight-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: publish-api-env
generatorOptions:
  disableNameSuffixHash: true

# GitHub Actions(bump-manifest)가 newTag 를 커밋 SHA 로 갱신. 초기값 stg.
images:
- name: core-api
  newName: ghcr.io/studieo-javry/core-api
  newTag: 03db90f054bb481a538eb8c2b4e7a32d8e969ff0
- name: iam-api
  newName: ghcr.io/studieo-javry/iam-api
  newTag: 6c951eb3b2ec82bc71a762dc2ce40620fe498045
- name: insight-api
  newName: ghcr.io/studieo-javry/insight-api
  newTag: 7b98895ab5d17b94740e1e012de3bf5c3167f6ed
- name: noti-api
  newName: ghcr.io/studieo-javry/noti-api
  newTag: 07d5cd958e687410c09b150d72366f6119c3a4df
- name: publish-api
  newName: ghcr.io/studieo-javry/publish-api
  newTag: 6c951eb3b2ec82bc71a762dc2ce40620fe498045
