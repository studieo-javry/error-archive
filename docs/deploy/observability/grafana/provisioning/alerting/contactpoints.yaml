apiVersion: 1
# 실제 배포본의 settings.url 에는 Slack Incoming Webhook URL 이 들어간다.
# 비밀값이라 git 에는 자리표시자만 둔다 — DB VM 의 실제 파일에만 진짜 URL 을 넣을 것.
contactPoints:
  - orgId: 1
    name: slack-ea
    receivers:
      - uid: slack_ea_receiver
        type: slack
        settings:
          url: <<SLACK_WEBHOOK_URL>>
        disableResolveMessage: false
