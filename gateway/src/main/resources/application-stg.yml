# ===================================================================
# stg — staging. prod 와 동일 구조, stg 도메인/값만 다름.
# - 시크릿(JWT secret / internal issuer 개인키)은 ENV/Secret 로만 주입.
# - JWT issuer/audience 는 stg iam-api 발급값과 일치.
# ===================================================================

spring:
  config:
    activate:
      on-profile: stg

server:
  port: ${GATEWAY_PORT:8000}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# G3: 사용자 JWT 검증 — stg iam 발급값과 일치.
iam:
  jwt:
    secret: ${IAM_JWT_SECRET}
    issuer: "https://iam.stg.studieo-javry.com"
    audience: "stg-clients"

# G4: 내부 토큰 발급자 — 개인키 ENV 주입.
internal-auth:
  ttl-seconds: 60
  issuer:
    name: gateway
    key-id: ${GATEWAY_INTERNAL_ISSUER_KEY_ID:gateway}
    private-key-pem: ${INTERNAL_AUTH_GATEWAY_PRIVATE_KEY}

gateway:
  # G2: 다운스트림 base-url — stg k8s Service DNS 를 ENV 로 주입.
  downstream:
    iam-api: ${GATEWAY_IAM_API_URI}
    core-api: ${GATEWAY_CORE_API_URI}
    noti-api: ${GATEWAY_NOTI_API_URI}
    insight-api: ${GATEWAY_INSIGHT_API_URI}
    publish-api: ${GATEWAY_PUBLISH_API_URI}
  # G5: CORS — stg FE origin.
  cors:
    allowed-origins:
      - https://app.stg.studieo-javry.com
    allow-credentials: true

# swagger aggregator 는 stg 에서도 노출 안 함(각 서비스 직접 확인).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    org.studieojavry: INFO
  pattern:
    console: "%d{ISO8601} %-5level [%X{traceId:-},%X{spanId:-}] [%thread] %logger{36} - %msg%n"

# G7: actuator 하드닝 — /internal/actuator 로 숨김.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /internal/actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    gateway:
      access: read_only
