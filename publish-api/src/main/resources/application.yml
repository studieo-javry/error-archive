# ===================================================================
# publish-api 공통 베이스
# ===================================================================

spring:
  application:
    name: publish-api
  profiles:
    default: prod          # 다른 서비스와 동일 — 명시 프로파일 없으면 prod. 로컬은 SPRING_PROFILES_ACTIVE=local
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  forward-headers-strategy: framework
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health

publish:
  core-api:
    # fail-fast: 기본값 없음. local/test yml 에 concrete, stg/prod 는 PUBLISH_CORE_API_BASE_URL env 필수.
    base-url: ${PUBLISH_CORE_API_BASE_URL}
  page:
    # 공개 페이지 base URL(절대 URL/공유 링크/sitemap). fail-fast: 기본값 없음 — env 필수(stg/prod).
    public-base-url: ${PUBLISH_PAGE_PUBLIC_BASE_URL}
  slug:
    # base62 슬러그 길이 (8 ≈ 62^8 = 218조 — 충돌 무시 가능)
    length: 8
  attachment:
    # core 와 동일 S3/MinIO 버킷. publish 는 서명(presign)만 하므로 endpoint-public(브라우저 도달) 만 필요.
    s3:
      bucket: ${PUBLISH_ATTACHMENT_BUCKET:error-archive-attachments}
      region: ${PUBLISH_ATTACHMENT_REGION:us-east-1}
      endpoint-public: ${PUBLISH_ATTACHMENT_S3_ENDPOINT_PUBLIC:http://localhost:9000}
      path-style: ${PUBLISH_ATTACHMENT_S3_PATH_STYLE:true}
      access-key: ${PUBLISH_ATTACHMENT_S3_ACCESS_KEY:minioadmin}
      secret-key: ${PUBLISH_ATTACHMENT_S3_SECRET_KEY:minioadmin}
      ttl: ${PUBLISH_ATTACHMENT_PRESIGN_TTL:30m}
