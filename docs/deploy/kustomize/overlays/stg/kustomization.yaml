apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# stg 환경(=alpha 브랜치). 네임스페이스 apps.
# 주의: 현재 배포는 prod 스프링 프로파일 + .env.prod 로 동작 → 여기 SPRING_PROFILES_ACTIVE=prod 유지.
namespace: apps

resources:
- ../../base/iam-api
- ../../base/core-api
- ../../base/noti-api
- ../../base/insight-api
- ../../base/publish-api

configMapGenerator:
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: iam-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: core-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: noti-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: insight-api-env
- literals:
  - SPRING_PROFILES_ACTIVE=prod
  name: publish-api-env
generatorOptions:
  disableNameSuffixHash: true

# GitHub Actions(bump-manifest)가 newTag 를 커밋 SHA 로 갱신. 초기값 stg.
images:
- name: core-api
  newName: ghcr.io/studieo-javry/core-api
  newTag: d2ebbd1deda036fadfc8109b1dc32c9f3fb01cfc
- name: iam-api
  newName: ghcr.io/studieo-javry/iam-api
  newTag: d2ebbd1deda036fadfc8109b1dc32c9f3fb01cfc
- name: insight-api
  newName: ghcr.io/studieo-javry/insight-api
  newTag: 41917e8071df5bfa4e7335353cc7bd2c5a106c27
- name: noti-api
  newName: ghcr.io/studieo-javry/noti-api
  newTag: d2ebbd1deda036fadfc8109b1dc32c9f3fb01cfc
- name: publish-api
  newName: ghcr.io/studieo-javry/publish-api
  newTag: d2ebbd1deda036fadfc8109b1dc32c9f3fb01cfc
